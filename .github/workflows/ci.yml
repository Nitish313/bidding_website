name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Weekly run, so newly published gem advisories are caught between pull requests.
  schedule:
    - cron: "0 6 * * 1"

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Run containers as the runner user
        run: echo "HOST_UID=$(id -u)" >> "$GITHUB_ENV" && echo "HOST_GID=$(id -g)" >> "$GITHUB_ENV"

      - name: Build image
        run: docker compose build web

      - name: Start MySQL
        run: docker compose up -d --wait db

      - name: Prepare test database
        run: docker compose run --rm -e RAILS_ENV=test web bin/rails db:create db:schema:load

      - name: Run tests
        run: docker compose run --rm -e RAILS_ENV=test web bin/rails test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Run containers as the runner user
        run: echo "HOST_UID=$(id -u)" >> "$GITHUB_ENV" && echo "HOST_GID=$(id -g)" >> "$GITHUB_ENV"

      - name: Build image
        run: docker compose build web

      - name: Run RuboCop
        run: docker compose run --rm --no-deps web bundle exec rubocop

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Run containers as the runner user
        run: echo "HOST_UID=$(id -u)" >> "$GITHUB_ENV" && echo "HOST_GID=$(id -g)" >> "$GITHUB_ENV"

      - name: Build image
        run: docker compose build web

      - name: Check gems for known vulnerabilities
        run: docker compose run --rm --no-deps web bundle exec bundle-audit check --update
