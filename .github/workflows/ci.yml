name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Weekly run, so newly published gem advisories are caught between pull requests.
  schedule:
    - cron: "0 6 * * 1"

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Run containers as the runner user
        run: echo "HOST_UID=$(id -u)" >> "$GITHUB_ENV" && echo "HOST_GID=$(id -g)" >> "$GITHUB_ENV"

      - name: Build image
        run: docker compose build web

      - name: Start MySQL
        run: docker compose up -d --wait db

      - name: Prepare test database
        run: docker compose run --rm -e RAILS_ENV=test web bin/rails db:create db:schema:load

      - name: Run tests
        run: docker compose run --rm -e RAILS_ENV=test web bin/rails test

      # The container can't see the runner's summary file, so the script writes the
      # coverage table into the mounted coverage/ folder and the next step publishes it.
      - name: Check coverage minimum
        run: docker compose run --rm --no-deps -e GITHUB_STEP_SUMMARY=/app/coverage/job-summary.md web bin/check-coverage
      - name: Show coverage in the job summary
        if: always()
        run: if [ -f coverage/job-summary.md ]; then cat coverage/job-summary.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Run containers as the runner user
        run: echo "HOST_UID=$(id -u)" >> "$GITHUB_ENV" && echo "HOST_GID=$(id -g)" >> "$GITHUB_ENV"

      - name: Build image
        run: docker compose build web

      - name: Run RuboCop
        run: docker compose run --rm --no-deps web bundle exec rubocop

      # Tests run in the test environment only; this catches breaks in development, and
      # the production-image job covers production.
      - name: Boot in development mode
        run: docker compose run --rm --no-deps web bin/rails runner 'puts "development boots"'

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Run containers as the runner user
        run: echo "HOST_UID=$(id -u)" >> "$GITHUB_ENV" && echo "HOST_GID=$(id -g)" >> "$GITHUB_ENV"

      - name: Build image
        run: docker compose build web

      - name: Check gems for known vulnerabilities
        run: docker compose run --rm --no-deps web bundle exec bundle-audit check --update

  production-image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Builds Dockerfile.prod, precompiling assets, and boots it against an empty
      # MySQL the way Render does.
      - name: Build and start the production image
        run: bin/smoke-test-production-image

  # Deploys master to Render once every check has passed. Needs the repository secret
  # RENDER_DEPLOY_HOOK_URL (see "Deploying" in README.md); without it nothing is deployed.
  deploy:
    needs: [test, lint, audit, production-image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    steps:
      - name: Trigger a Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::notice::RENDER_DEPLOY_HOOK_URL is not set, so nothing was deployed."
            exit 0
          fi
          curl --silent --show-error --fail --request POST --output /dev/null "$RENDER_DEPLOY_HOOK_URL"
          echo "Deploy of ${GITHUB_SHA::7} started on Render." >> "$GITHUB_STEP_SUMMARY"
