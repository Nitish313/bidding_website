require:
  - rubocop-rails
  - rubocop-minitest

inherit_from: .rubocop_todo.yml

inherit_mode:
  merge:
    - Exclude
    - AllowedIdentifiers

AllCops:
  TargetRubyVersion: 3.3
  TargetRailsVersion: 8.1
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - bin/**/*
    - db/schema.rb
    - node_modules/**/*
    - tmp/**/*
    - vendor/**/*

# The codebase predominantly uses double quotes.
Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Style/FrozenStringLiteralComment:
  Enabled: false

Style/Documentation:
  Enabled: false

# Long, descriptive test classes and blocks are fine.
Metrics/ClassLength:
  Exclude:
    - test/**/*

Metrics/BlockLength:
  Exclude:
    - config/routes.rb
    - config/environments/*
    - test/**/*

Minitest/EmptyLineBeforeAssertionMethods:
  Enabled: false

Minitest/MultipleAssertions:
  Max: 5
  # End-to-end flows check each step.
  Exclude:
    - test/integration/**/*

# Tests deliberately put records into specific states.
Rails/SkipsModelValidations:
  Exclude:
    - test/**/*

# Column names on the solutions table.
Naming/VariableNumber:
  AllowedIdentifiers:
    - attachment_1
    - attachment_2
    - attachment_3

# Seeds print the generated admin password to the terminal on purpose.
Rails/Output:
  Exclude:
    - db/seeds.rb

# Both `{ id: id }` and Ruby 3.1's `{ id: }` are fine; don't churn existing code.
Style/HashSyntax:
  EnforcedShorthandSyntax: either
