services:
  db:
    image: mysql:8.0.39
    # mysql2 0.5.3 built against Debian buster's client library needs native auth.
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    env_file:
      - path: .env
        required: false
    command: bash -c "rm -f tmp/pids/server.pid && bin/rails server -b 0.0.0.0"
    # Run as the host user so files written into the mounted app directory
    # (tmp/, log/, public/uploads/) belong to you rather than root.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      HOME: /tmp
      DB_HOST: db
      DB_USERNAME: root
    volumes:
      - .:/app
    ports:
      # Reachable from this machine only, not from the local network.
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
